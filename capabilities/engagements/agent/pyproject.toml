[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "greenhouse-engagements-agent"
version = "0.1.0"
description = "Microsoft Agent Framework runtime for the Strategic Engagements orchestrator"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-core==1.12.1",
  "agent-framework-openai==1.11.0",
  "agent-governance-toolkit-core==4.1.0",
  "azure-identity==1.25.3",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "mcp==1.29.0",
  "openai==2.49.0",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
]

[tool.setuptools.packages.find]
include = ["engagements_agent*"]

[tool.setuptools.package-data]
engagements_agent = [
  "skills/*/SKILL.md",
  "skills/*/references/*.md",
  "skills/*/references/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
