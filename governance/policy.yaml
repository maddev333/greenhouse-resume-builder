# Microsoft Agent Governance Toolkit 4.1 policy.
# Loaded by the Python agent runtime through agent_os.policies.PolicyEvaluator.
version: "1.0"
name: greenhouse-engagements-agent
description: Governance policy for model-driven and deterministic MCP tool calls.

rules:
  - name: block-destructive-tools
    condition:
      field: tool_name
      operator: matches
      value: "(?i)(delete|drop|truncate|purge|shell_exec|execute_shell)"
    action: deny
    priority: 100
    message: Destructive operations are not agent capabilities.

  - name: block-ssn
    condition:
      field: message
      operator: matches
      value: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
    action: deny
    priority: 90
    message: SSN-like data must not be sent to the model or an MCP tool.

  - name: block-unapproved-direct-writes
    condition:
      field: tool_name
      operator: in
      value:
        - index_upsert
        - upsert_explicit_relationship
    action: deny
    priority: 80
    message: Direct writes require a separately implemented MAF approval workflow.

defaults:
  action: allow
  max_tokens: 8192
  max_tool_calls: 10
  confidence_threshold: 0.8
