<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LLMWiki Browser</title>

<!-- CSP — only allow connect to LLM wiki server (localhost:8765 in dev) -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://d3js.org;
               style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />

<style>
  :root {
    --bg-main: #ffffff; --bg-panel: #fafbfc; --border: #e2e4e8;
    --text-primary: #1a1d22; --text-secondary: #65676b;
    --accent: #045eff; --accent-bg: #e6edf3; --hover: #f0f2f5;
    --search-bg: #f6f7f8; --snippet-highlight: #fff3cd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; color: var(--text-primary); background: var(--bg-main); height: 100vh; overflow: hidden; }

  .wiki-browser {
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    grid-template-rows: auto 1fr;
    height: 100vh;
    gap: 0;
  }

  /* ── Header / Search Bar ── */
  .header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
  }
  .logo { font-weight: 700; font-size: 18px; color: var(--accent); white-space: nowrap; }
  .search-box {
    flex: 1; max-width: 600px; display: flex; gap: 8px;
  }
  .search-box input {
    flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; background: var(--search-bg); outline: none; min-width: 0;
  }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(4,94,255,.15); }
  .search-box button { padding: 8px 16px; background: var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; white-space:nowrap; }
  .search-box button:hover { opacity:.9; }
  .filter-group { display: flex; gap: 6px; align-items: center; font-size:12px; color: var(--text-secondary); }
  .filter-group select { padding: 4px 8px; border:1px solid var(--border); border-radius:4px; font-size:12px; background:var(--search-bg); cursor:pointer; }

  /* ── Sidebar (Collection Tree) ── */
  .sidebar {
    border-right: 1px solid var(--border); overflow-y:auto; padding:8px 0;
    background: var(--bg-panel);
  }
  .sidebar-title { font-size:11px; font-weight:600; text-transform:uppercase; color:var(--text-secondary); padding:4px 16px; margin-bottom:4px; }
  .collection-node, .doc-node, .section-node { cursor:pointer; padding:3px 8px; font-size:13px; line-height:1.5; color: var(--text-primary); }
  .collection-node:hover, .doc-node:hover { background: var(--hover); }
  .collection-node.selected { background: var(--accent-bg); border-left:2px solid var(--accent); }
  .badge { font-size:10px; opacity:.75; margin-left:4px; color:var(--text-secondary); }
  .indent-1 { padding-left:32px !important; }
  .indent-2 { padding-left:48px !important; }
  .collapse-btn { display:inline-block; width:16px; font-size:10px; text-align:center; color:var(--text-secondary); user-select:none; cursor:pointer; }

  /* ── Results Panel ── */
  .results-panel {
    border-right: 1px solid var(--border); overflow-y:auto; padding:12px 16px; background: var(--bg-main);
  }
  .results-header { font-size:12px; color:var(--text-secondary); margin-bottom:8px; font-weight:500; }
  .hit-item {
    padding:10px 12px; border:1px solid var(--border); border-radius:6px;
    margin-bottom:8px; cursor:pointer; background:#fff; transition:border-color .15s;
  }
  .hit-item:hover { border-color:var(--accent); }
  .hit-item.active { border-color:var(--accent); background:var(--accent-bg); }
  .hit-title { font-weight:600; font-size:14px; margin-bottom:2px; color:var(--text-primary); }
  .hit-heading { font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
  .hit-snippet { font-size:13px; line-height:1.5; color:var(--text-primary); }
  .hit-snippet mark { background: var(--snippet-highlight); padding:0 2px; border-radius:2px; }
  .hit-meta { font-size:11px; color:var(--text-secondary); margin-top:4px; display:flex; gap:8px; }

  /* ── Content / Detail Area ── */
  .content-area {
    overflow-y:auto; padding:16px 24px; background: var(--bg-main);
  }
  .content-heading { font-size:20px; font-weight:700; margin-bottom:4px; }
  .content-path { font-size:12px; color:var(--text-secondary); margin-bottom:12px; }
  .body-text { font-size:14px; line-height:1.7; color:var(--text-primary); white-space:pre-wrap; margin-bottom:16px; max-width:800px; }
  .nav-buttons { display:flex; gap:8px; margin-top:12px; }
  .nav-btn { font-size:12px; padding:4px 12px; border:1px solid var(--border); border-radius:4px; background:#fff; cursor:pointer; color:var(--text-primary); }
  .nav-btn:hover { background:var(--hover); }

  /* ── Right Panel (Concept explorer) ── */
  .concept-panel { overflow-y:auto; padding:12px 16px; background: var(--bg-panel); border-left:1px solid var(--border); }
  .panel-title { font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .concept-node { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; margin:3px; background:#fff; border:1px solid var(--border); border-radius:20px; font-size:12px; cursor:pointer; transition:border-color .15s; }
  .concept-node:hover { border-color:var(--accent); }
  .concept-node .kind-badge { font-size:9px; padding:1px 4px; border-radius:3px; font-weight:600; text-transform:uppercase; }
  .concept-node .kind-badge.concept { background:#d0f0d0; color:#2d6a2d; }
  .concept-node .kind-badge.rule    { background:#ffd54f; color:#7a5900; }
  .concept-node .kind-badge.entity  { background:#bbdefb; color:#1565c0; }
  .concept-node .kind-badge.template{ background:#e1bee7; color:#7b1fa2; }
  .concept-list { margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:12px; }
  #graph-svg { width:100%; height:380px; display:block; }
  .empty-state { color:var(--text-secondary); font-size:13px; text-align:center; padding:40px 20px; font-style:italic; }

  /* ── Responsive ── */
  @media (max-width:900px) {
    .wiki-browser { grid-template-columns:220px 1fr 260px; }
  }
  @media (max-width:700px) {
    .wiki-browser { grid-template-columns:1fr; grid-template-rows:auto auto 1fr; }
    .sidebar { max-height:200px; border-right:none; border-bottom:1px solid var(--border); }
    .results-panel { max-height:250px; border-right:none; border-bottom:1px solid var(--border); }
    .concept-panel { display:none; }
  }
</style>
</head>
<body>

<div class="wiki-browser">

  <!-- Header / Search -->
  <div class="header">
    <span class="logo">LLMWiki</span>
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search sections in corpus…" />
      <button id="search-btn">Browse / Explore</button>
    </div>
    <div class="filter-group">
      Collections:
      <select id="collection-filter"><option value="">All</option></select>
      Flavor:
      <select id="flavor-filter"><option value="">All</option><option value="raw">Raw</option><option value="wiki">Wiki</option></select>
    </div>
  </div>

  <!-- Left Sidebar — Collection Tree -->
  <aside class="sidebar" id="sidebar">
    <div class="empty-state">Loading collections…</div>
  </aside>

  <!-- Center: Search Results -->
  <main class="results-panel" id="results-panel">
    <div class="empty-state">Click Browse to explore the wiki corpus.</div>
  </main>

  <!-- Right Panel: Content / Concept Graph -->
  <aside class="content-area" id="content-area">
    <div class="empty-state">Select a hit or collection to view content.</div>
  </aside>

  <!-- Far-right Concept Explorer (replaced by concept-panel below) -->
  <div class="concept-panel" id="concept-panel" style="position:absolute;right:0;top:48px;width:260px;height:calc(100vh - 48px);">
    <div class="panel-title">Concepts</div>
    <div id="concept-list" class="concept-list"></div>

    <!-- SVG concept graph area -->
    <svg id="graph-svg"></svg>
  </aside>

</div>

<!-- D3.js for graph visualization (only dep) — loaded from CDN in production with CSP allowlist above -->
<script src="https://d3js.org/d3.v7.min.js"></script>

<script>
// ─── State & Config ────────────────────────────────────────
const state = {
  collections: [],       // CollectionInfo[]  (populated on manifest load)
  docsByCollection: {},  // Map<collectionId, DocumentInfo[]>
  searchHits: [],        // SearchHit[]
  selectedSection: null, // SectionResult | null
  activeMode: 'manifest',// 'manifest' | 'search' | 'navigation'
  query: '',
  // NOTE: This view runs in a sandboxed iframe in MCP Apps hosts.
  // localStorage/sessionStorage are typically unavailable there, so we avoid them.
  searchMcpUrl: 'http://localhost:8765/api/mcp/llmwiki',
};

// ─── MCP Bridge (postMessage protocol between widget ↔ host) ──
// This view is an MCP Apps iframe. Strict hosts (app-bridge.js) will reject
// `tools/call` until the view completes the handshake via `ui/initialize`.

let bridgeInitialized = false;
let connectPromise = null;
let nextId = 1;
const pending = new Map(); // id -> {resolve,reject}

function sendRpc(message) {
  window.parent.postMessage(message, '*');
}

const RPC_TIMEOUT_MS = 5000;

function requestRpc(method, params) {
  const id = nextId++;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pending.delete(id);
      reject(new Error(`MCP RPC timeout (${method}) after ${RPC_TIMEOUT_MS}ms`));
    }, RPC_TIMEOUT_MS);

    pending.set(id, {
      resolve: (v) => {
        clearTimeout(timer);
        resolve(v);
      },
      reject: (e) => {
        clearTimeout(timer);
        reject(e);
      },
    });

    sendRpc({ jsonrpc: '2.0', id, method, params });
  });
}

function notifyRpc(method, params) {
  sendRpc(
    params === undefined
      ? { jsonrpc: '2.0', method }
      : { jsonrpc: '2.0', method, params }
  );
}

// Resolve inbound JSON-RPC responses.
window.addEventListener('message', (event) => {
  const msg = event.data;
  if (!msg || msg.jsonrpc !== '2.0') return;
  if (msg.id == null) return;
  const slot = pending.get(msg.id);
  if (!slot) return;
  pending.delete(msg.id);
  if (msg.error) slot.reject(new Error(msg.error.message ?? 'host error'));
  else slot.resolve(msg.result);
});

let callToolImpl = async (name, args) => {
  return await requestRpc('tools/call', { name, arguments: args || {} });
};

const bridge = {
  /** Send a tool call to the host MCP */
  callTool(name, args) {
    return (async () => {
      if (!connectPromise) connectPromise = startConnect();
      await connectPromise;
      return await callToolImpl(name, args);
    })();
  },
  /** Send data from widget → host (UI actions, selections) */
  send(name, payload) {
    window.parent.postMessage({ type: 'mcp-app-params', action: name, params: payload }, '*');
  }
};

async function startConnect() {
  // Legacy embedded mode: host exposes global mcpHost.
  if (globalThis.mcpHost && typeof globalThis.mcpHost.callTool === 'function') {
    callToolImpl = async (name, args) => await globalThis.mcpHost.callTool(name, args);
    bridgeInitialized = true;
    return;
  }

  // MCP Apps handshake.
  try {
    await requestRpc('ui/initialize', {
      appInfo: { name: 'llmwiki-browser', version: '1.0.0' },
      appCapabilities: {},
      protocolVersion: '2026-01-26',
    });
    notifyRpc('ui/notifications/initialized');
  } catch (e) {
    // If we're not inside an MCP Apps host, allow best-effort (no hard gate).
    // Strict hosts should succeed here.
  }

  bridgeInitialized = true;
}

// Kick off connect immediately so early calls during init are gated.
connectPromise = startConnect();

// ─── Helpers ─────────────────────────────
function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function snippetHighlight(snippet, query) {
  if (!query) return snippet;
  return snippet.replace(new RegExp('(?<![a-zA-Z])' + query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '(?![a-zA-Z])', 'gi'),
    m => `<mark>${m}</mark>`);
}

// ─── Collection Tree (sidebar) ──────────
async function loadCollections() {
  const result = await bridge.callTool('list_collections', {});
  state.collections = result?.collections || [];
  document.getElementById('sidebar').innerHTML = '';
  for (const coll of state.collections) {
    const row = document.createElement('div');
    const collapseSpan = '<span class="collapse-btn" data-action="toggle">▸</span>';
    row.innerHTML = `${collapseSpan}<span class="collection-node" data-id="${escapeHTML(coll.id)}">${escapeHTML(coll.name)}<span class="badge">[${coll.document_count}]</span></span>`;
    document.getElementById('sidebar').appendChild(row);

    // Toggle expand
    const btn = row.querySelector('.collapse-btn');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const expanded = btn.getAttribute('data-expanded') !== 'true';
      btn.textContent = expanded ? '▾' : '▸';
      btn.setAttribute('data-expanded', expanded);
      if (expanded) loadDocsInCollection(coll.id, row);
    });

    // Click to select collection (also expands docs so users can explore)
    row.querySelector('.collection-node').addEventListener('click', () => {
      const expanded = btn.getAttribute('data-expanded') === 'true';
      if (!expanded) {
        btn.textContent = '▾';
        btn.setAttribute('data-expanded', 'true');
        loadDocsInCollection(coll.id, row);
      }

      const panel = document.getElementById('results-panel');
      panel.innerHTML = `
        <div class="results-header">Collection: ${escapeHTML(coll.name)}</div>
        <div class="empty-state" style="text-align:left;font-style:normal;padding:12px 0;">
          Select a document in the sidebar to view its sections.
        </div>
      `;
    });
  }
}

async function loadDocsInCollection(collectionId, container) {
  const existing = container.querySelector('.doc-expand');
  if (existing) existing.remove();

  const result = await bridge.callTool('list_documents', { collection: collectionId, limit: 10 });
  const docs = result?.documents || [];
  parentMap.setDocs(collectionId, docs);

  const expandDiv = document.createElement('div');
  expandDiv.className = 'doc-expand';
  for (const doc of docs) {
    const row = document.createElement('div');
    row.className = 'doc-node indent-1';
    row.dataset.docId = doc.id;
    row.title = `${doc.title} (${doc.page_count?.slice(0,5) || '?'} pages)`;
    row.textContent = `  📄 ${escapeHTML(doc.title)} [${doc.doc_type}]`;
    row.addEventListener('click', () => showDocumentSections(doc));
    expandDiv.appendChild(row);
  }
  container.appendChild(expandDiv);
}

const parentMap = {
  setDocs(collectionId, docs) { state.docsByCollection[collectionId] = docs; },
};

async function showCollectionManifest(coll) {
  const panel = document.getElementById('results-panel');
  document.getElementById('content-area').innerHTML = '<div class="empty-state">Select a document to view sections.</div>';
  panel.innerHTML = `<div class="empty-state">Loading documents for "${escapeHTML(coll.name)}"…</div>`;

  try {
    const result = await bridge.callTool('list_documents', { collection: coll.id, max_results: 50 });
    const docs = result?.documents || [];
    parentMap.setDocs(coll.id, docs);

    panel.innerHTML =
      `<div class="results-header">Collection: ${escapeHTML(coll.name)} (${docs.length} docs)</div>` +
      docs.map(doc => `
        <div class="hit-item" data-doc-id="${escapeHTML(doc.id)}">
          <div class="hit-title">${escapeHTML(doc.title)}</div>
          <div class="hit-heading">${escapeHTML(doc.doc_type || '')}</div>
          <div class="hit-snippet">${doc.page_count != null ? 'Pages: ' + escapeHTML(String(doc.page_count)) : ''}</div>
        </div>
      `).join('');

    panel.querySelectorAll('.hit-item').forEach(el => {
      el.addEventListener('click', () => {
        const docId = el.dataset.docId;
        const doc = docs.find(d => d.id === docId);
        if (doc) showDocumentSections(doc);
      });
    });
  } catch (e) {
    panel.innerHTML = `<div class="empty-state">Failed to load collection: ${escapeHTML(e?.message || String(e))}</div>`;
  }
}

async function showDocumentSections(doc) {
  const panel = document.getElementById('results-panel');
  const area = document.getElementById('content-area');
  panel.innerHTML = `<div class="empty-state">Loading sections for "${escapeHTML(doc.title)}"…</div>`;
  area.innerHTML = '<div class="empty-state">Loading section…</div>';

  try {
    const result = await bridge.callTool('list_sections_for_document', { document_id: doc.id });
    const sections = result?.sections || [];

    if (sections.length === 0) {
      panel.innerHTML = '<div class="empty-state">No sections found for this document.</div>';
      return;
    }

    panel.innerHTML =
      `<div class="results-header">${sections.length} sections in "${escapeHTML(doc.title)}"</div>` +
      sections.map(s => `
        <div class="hit-item" data-section-id="${escapeHTML(s.id)}">
          <div class="hit-title">${escapeHTML(s.heading_path || s.heading || 'Section')}</div>
          <div class="hit-heading">#${escapeHTML(String(s.ordinal ?? '—'))}</div>
        </div>
      `).join('');

    panel.querySelectorAll('.hit-item').forEach(el => {
      el.addEventListener('click', () => {
        panel.querySelectorAll('.hit-item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        showSectionDetail(el.dataset.sectionId);
      });
    });
  } catch (e) {
    panel.innerHTML = `<div class="empty-state">Failed to load sections: ${escapeHTML(e?.message || String(e))}</div>`;
    area.innerHTML = '<div class="empty-state">Select another section.</div>';
  }
}

// ─── Search → Results Panel (center) ──
async function doSearch(query, collection, flavor, docType) {
  state.query = query;
  const browseResult = await bridge.callTool('browse_wiki', { query, collection, flavor, doc_type: docType });
  const structured = browseResult?.structuredContent ?? browseResult;
  // Also call search_wiki_sections for the snippet data.
  const searchResult = await bridge.callTool('search_wiki_sections', { query, collection, doc_type: docType, flavor, max_results:20 });
  renderSearchResults(searchResult, structured?.hits);
}

function renderSearchResults(manifestOrHits, hitsOverride) {
  const panel = document.getElementById('results-panel');
  if (hitsOverride && hitsOverride.length > 0) {
    panel.innerHTML = `<div class="results-header">${hitsOverride.length} results for "${escapeHTML(state.query)}"</div>` +
      hitsOverride.map(h => `
        <div class="hit-item" data-section="${escapeHTML(h.section_id)}">
          <div class="hit-title">${escapeHTML(h.document_title || '')}</div>
          <div class="hit-heading">${escapeHTML(h.heading_path || h.heading)}</div>
          <div class="hit-snippet">${snippetHighlight(escapeHTML(h.snippet), state.query)}</div>
          <div class="hit-meta">
            <span>$\{h.score?.toFixed(3) || '—'}</span>
            ${h.collection_id ? '<span>| ' + escapeHTML(h.collection_id) + '</span>' : ''}
            ${h.source_path ? '<span>| ' + escapeHTML(h.source_path.split('/').pop() || '') + '</span>' : ''}
          </div>
        </div>`).join('');

    panel.querySelectorAll('.hit-item').forEach(el => {
      el.addEventListener('click', () => {
        panel.querySelectorAll('.hit-item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        showSectionDetail(el.dataset.section);
      });
    });
  } else if (manifestOrHits?.mode === 'manifest') {
    const m = manifestOrHits;
    panel.innerHTML = `<div class="results-header">${m.total_collections} collections</div>` +
      (m.collections || []).map(c => `
        <div class="hit-item">
          <div class="hit-title">${escapeHTML(c.name)}</div>
          <div class="hit-heading">${escapeHTML(c.description).substring(0,80)}…</div>
          <div class="hit-snippet">${c.document_count} docs · ${c.section_count} sections · ${c.concept_count} concepts</div>
          <div class="hit-meta">Last: ${new Date(c.last_ingested_at * 1000).toLocaleDateString()}</div>
        </div>`).join('');

    panel.querySelectorAll('.hit-item').forEach(el => {
      const cols = m.collections.find(c => c.name === el.querySelector('.hit-title')?.textContent);
      if (cols) el.addEventListener('click', () => showCollectionManifest(cols));
    });
  } else {
    panel.innerHTML = '<div class="empty-state">No results to display.</div>';
  }
}

// ─── Section Detail (right panel area — actually below the content header) ──
async function showSectionDetail(sectionId) {
  state.selectedSection = sectionId;
  const result = await bridge.callTool('read_wiki_section', { section_id: sectionId, include_neighbors:true });

  // Show in center results panel (section body), not the concept panel.
  const detailResult = result?.payload || result;
  if (!detailResult) return alert('Section not found');

  const area = document.getElementById('content-area');
  area.innerHTML = `
    <div class="content-heading">${escapeHTML(detailResult.heading || detailResult.document?.title || '')}</div>
    <div class="content-path">${escapeHTML(detailResult.heading_path || detailResult.document_id || '')}</div>
    <div class="body-text">${highlightBody(escapeHTML(detailResult.body || ''))}</div>
    <div class="nav-buttons">
      ${detailResult.previous_section_id ? '<button class="nav-btn" onclick="showSectionDetail(\'' + detailResult.previous_section_id + '\')">← Previous</button>' : ''}
      ${detailResult.next_section_id ? '<button class="nav-btn" onclick="showSectionDetail(\'' + detailResult.next_section_id + '\')">Next →</button>' : ''}
    </div>
  `;

  // Update concept panel
  loadConcepts(detailResult);
}

function highlightBody(body) {
  // Simple line wrapping — in production you'd want Markdown rendering.
  return body;
}

// ─── Concept List + Graph (right panel) ──
async function loadConcepts(sectionOrDoc) {
  const conceptIds = [];
  for (const c of getAllConcepts()) { // Simplified: find concepts in this section/document
    conceptIds.push(c.id);
  }

  const list = document.getElementById('concept-list');
  list.innerHTML = '';

  // Load concepts details
  let relatedMap = {};
  for (const cid of conceptIds.slice(0,12)) {
    try {
      const rc = await bridge.callTool('get_concept', { concept_id: cid });
      if (rc?.concept) relatedMap[cid] = rc;
    } catch(e) { console.warn('loadConcepts error', e); }
  }

  for (const cid in relatedMap) {
    const c = relatedMap[cid].concept;
    const span = document.createElement('span');
    span.className = 'concept-node';
    span.innerHTML = `<span class="kind-badge ${c.kind}">${c.kind}</span> ${escapeHTML(c.name)}`;
    span.addEventListener('click', () => showConceptDetail(cid));
    list.appendChild(span);
  }

  // Render graph (D3 force-directed) of related concepts
  renderConceptGraph(relatedMap, conceptIds);
}

function getAllConcepts() { return []; } // Simplified for layout — real impl would scan doc sections.

function showConceptDetail(id) {
  bridge.callTool('get_concept', { concept_id: id }).then(r => {
    const area = document.getElementById('content-area');
    const c = r.concept;
    area.innerHTML = `<div class="content-heading">${escapeHTML(c.name)}</div>
      <div class="content-path">${c.kind}</div>
      <div class="body-text">${escapeHTML(c.definition || 'No definition provided.')}</div>
      <hr><div style="margin-top:8px;font-size:12px;color:var(--text-secondary);">Related:</div>` +
      (r.related||[]).slice(0,6).map(rel => `<a class="concept-node" onclick="showConceptDetail('${rel.concept.id}')" onmouseover=\"event.target.style.borderColor='var(--accent)'\">${escapeHTML(rel.concept.name)} <span style=font-size:10px;color:var(--text-secondary)>([${rel.relation || 'related'})</span></a>`).join(' ');
  });
}

function renderConceptGraph(conceptMap, conceptIds) {
  const svgEl = document.getElementById('graph-svg');
  d3.select(svgEl).selectAll('*').remove();

  if (Object.keys(conceptMap).length < 2) return; // Not enough nodes for a graph.

  const container = svgEl.parentElement;
  svgEl.setAttribute('width', container.clientWidth);
  svgEl.setAttribute('height', Math.min(380, container.clientHeight));

  const links = [];
  const nodes = Object.entries(conceptMap).map(([id, r]) => ({ id, name: r.concept.name, kind: r.concept.kind }));

  // Add link between all pairs within this set.
  for (let i=0;i<nodes.length;i++) {
    for (let j=i+1;j<nodes.length;j++) {
      const relA = conceptMap[nodes[i].id]?.related?.find(x => x.concept?.id === nodes[j].id);
      if (relA) links.push({ source: i, target: j, relation: relA.relation });
    }
  }

  const width = +svgEl.getAttribute('width') || 200;
  const height = +svgEl.getAttribute('height') || 340;

  const colorMap = { concept:'#2d6a2d', rule:'#8f6c00', entity:'#1565c0', template:'#7b1fa2' };

  const g = d3.select(svgEl).append('g');
  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id))
    .force('charge', d3.forceManyBody().strength(-180))
    .force('center', d3.forceCenter(width/2, height/(height<200?2:1)));

  const linkSel = g.selectAll('.link')
    .data(links).join('line')
      .attr('class','link').attr('stroke','#ddd').attr('stroke-width',1.5);

  const nodeSel = g.selectAll('.node')
    .data(nodes).join('g')
      .attr('class','node').call(d3.drag()
        .on('start',(e,d)=>simulation.alphaTarget(0.3).restart())
        .on('drag',d3.drag().subject()))
      .on('click', d => showConceptDetail(d.id));

  nodeSel.append('circle')
    .attr('r', d => d.name.length<6?8:12)
    .attr('fill', d => colorMap[d.kind] || '#999');

  nodeSel.append('text')
    .attr('x', d => d.name.length<4?-20:(d.name.length<6?-25:-32))
    .attr('y', -16)
    .text(d => d.name)
    .style('font-size','11px').style('fill','#555');

  simulation.on('tick', () => {
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
    linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
           .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  });
}

// ─── Initialization ─────────────────────────────
async function init() {
  document.getElementById('search-btn').onclick = async () => {
    const q = document.getElementById('search-input').value.trim();
    const panel = document.getElementById('results-panel');
    panel.innerHTML = '<div class="empty-state">Loading…</div>';
    try {
      if (q) {
        await doSearch(q, document.getElementById('collection-filter').value, document.getElementById('flavor-filter').value);
      } else {
        // Manifest mode: populate both the sidebar and the results panel.
        await loadCollections();
        const browseResult = await bridge.callTool('browse_wiki', {});
        const structured = browseResult?.structuredContent ?? browseResult;
        renderSearchResults(structured);
      }
    } catch (e) {
      panel.innerHTML = `<div class="empty-state">Browse failed: ${escapeHTML(e?.message || String(e))}</div>`;
    }
  };

  document.getElementById('search-input').onkeydown = e => {
    if (e.key === 'Enter') document.getElementById('search-btn').click();
  };

  const panel = document.getElementById('results-panel');
  panel.innerHTML = '<div class="empty-state">Loading…</div>';
  try {
    await loadCollections();
    const browseResult = await bridge.callTool('browse_wiki', {});
    const structured = browseResult?.structuredContent ?? browseResult;
    renderSearchResults(structured);
  } catch (e) {
    panel.innerHTML = `<div class="empty-state">Browse failed: ${escapeHTML(e?.message || String(e))}</div>`;
  }
  document.getElementById('graph-svg').style.display = 'none'; // Hide graph until concepts loaded.
}

document.addEventListener('DOMContentLoaded', init);
// ─── End of wiki-browser.html ──────────────
</script>
