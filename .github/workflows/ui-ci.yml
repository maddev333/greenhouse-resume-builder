name: UI CI

# Auto-triggers are disabled in favor of manual zip deploys. Run on demand
# from the Actions tab ("Run workflow") if you need a CI build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_AZURE_AD_CLIENT_ID: ${{ vars.VITE_AZURE_AD_CLIENT_ID }}
      VITE_API_CLIENT_ID: ${{ vars.VITE_API_CLIENT_ID }}
      VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
      VITE_APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace ui
