name: UI CI

on:
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/ui-ci.yml'
  push:
    branches: [ main, workshop/dev-pipelines ]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
