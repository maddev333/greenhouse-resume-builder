name: UI Zip Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
  push:
    branches: [ main, workshop/dev-pipelines ]
    paths:
      - '.github/workflows/ui-zip-deploy.yml'
      - 'ui/**'

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (UI)
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Package UI for deployment
        working-directory: ui/dist
        run: zip -r ../../ui-deploy.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-deploy
          path: ui-deploy.zip

  deploy-to-azure:
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-deploy

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.UI_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ui-deploy.zip