name: Deploy UI to Azure App Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - deploy-ui-workflow
      - update-ui-vite-auth-vars
    paths:
      - 'ui/**'
      - '.github/workflows/ui-zip-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      VITE_AZURE_AD_CLIENT_ID: ${{ vars.VITE_AZURE_AD_CLIENT_ID }}
      VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
      VITE_API_CLIENT_ID: ${{ vars.VITE_API_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package build output
        run: |
          cd dist
          zip -r ../ui-dist.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_UI_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_UI_PUBLISH_PROFILE }}
          package: ui/ui-dist.zip
