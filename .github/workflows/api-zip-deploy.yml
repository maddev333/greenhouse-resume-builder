name: Deploy API to Azure Web App

on:
  push:
    branches:
      - deploy-api-workflow
      - main
    paths:
      - 'api/**'
      - 'shared/**'
      - '.github/workflows/api-zip-deploy.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace shared

      - name: Build api package
        run: npm run build --workspace api

      - name: Prune dev dependencies for api
        run: npm prune --omit=dev --workspace api

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -R api/dist deploy/dist
          cp api/package.json deploy/package.json
          cp api/package-lock.json deploy/package-lock.json
          cp -R api/node_modules deploy/node_modules
          # Create root server.js for Azure App Service compatibility (points to dist/server.js)
          echo "require('./dist/server.js');" > deploy/server.js

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure Web App settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          app-settings-json: |
            [
              {"name": "PGHOST", "value": "${{ vars.PGHOST }}"},
              {"name": "PGPORT", "value": "${{ vars.PGPORT || '5432' }}"},
              {"name": "PGDATABASE", "value": "${{ vars.PGDATABASE || 'resume_builder' }}"},
              {"name": "PGUSER", "value": "${{ vars.PGUSER }}"},
              {"name": "PGPASSWORD", "value": "${{ vars.PGPASSWORD || '' }}"},
              {"name": "PGSSLMODE", "value": "${{ vars.PGSSLMODE || 'require' }}"},
              {"name": "PG_AAD_SCOPE", "value": "${{ vars.PG_AAD_SCOPE || 'https://ossrdbms-aad.database.windows.net/.default' }}"},
              {"name": "PG_POOL_MAX", "value": "${{ vars.PG_POOL_MAX || '10' }}"},
              {"name": "AZURE_SEARCH_SERVICE", "value": "${{ vars.AZURE_SEARCH_SERVICE }}"},
              {"name": "AZURE_SEARCH_API_KEY", "value": "${{ vars.AZURE_SEARCH_API_KEY || '' }}"},
              {"name": "AZURE_SEARCH_ENDPOINT_SUFFIX", "value": "${{ vars.AZURE_SEARCH_ENDPOINT_SUFFIX || 'search.windows.net' }}"},
              {"name": "AZURE_TENANT_ID", "value": "${{ vars.AZURE_TENANT_ID }}"},
              {"name": "AZURE_AD_CLIENT_ID", "value": "${{ vars.AZURE_AD_CLIENT_ID }}"},
              {"name": "AZURE_AUTHORITY_HOST", "value": "${{ vars.AZURE_AUTHORITY_HOST || 'https://login.microsoftonline.com' }}"},
              {"name": "PORT", "value": "3001"},
              {"name": "NODE_ENV", "value": "production"},
              {"name": "WEBSITE_NODE_DEFAULT_VERSION", "value": "~20"}
            ]

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: deploy
