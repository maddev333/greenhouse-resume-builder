name: Deploy API to Azure Web App

on:
  push:
    branches:
      - deploy-api-workflow
      - main
    paths:
      - 'api/**'
      - 'shared/**'
      - '.github/workflows/api-zip-deploy.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace shared

      - name: Build api package
        run: npm run build --workspace api

      - name: Prune dev dependencies for api
        run: npm prune --omit=dev --workspace api

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -R api/dist deploy/dist
          cp api/package.json deploy/package.json
          cp api/package-lock.json deploy/package-lock.json
          cp -R api/node_modules deploy/node_modules
          # Create root server.js for Azure App Service compatibility (points to dist/server.js)
          echo "require('./dist/server.js');" > deploy/server.js

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: deploy

      - name: Configure Azure Web App settings for Managed Identities
        uses: azure/cli@v2
        with:
          inlineScript: |
            az login --service-principal --username ${{ secrets.AZURE_CLIENT_ID }} --password ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
             
            az webapp config appsettings set \
              --name ${{ vars.AZURE_API_APP_NAME }} \
              --resource-group ${{ vars.AZURE_API_RESOURCE_GROUP }} \
              --settings \
                PGHOST=${{ secrets.PGHOST }} \
                PGPORT=${{ secrets.PGPORT || '5432' }} \
                PGDATABASE=${{ secrets.PGDATABASE || 'resume_builder' }} \
                PGUSER=${{ secrets.PGUSER }} \
                PGPASSWORD="${{ secrets.PGPASSWORD || '' }}" \
                PGSSLMODE=${{ secrets.PGSSLMODE || 'require' }} \
                PG_AAD_SCOPE=${{ secrets.PG_AAD_SCOPE || 'https://ossrdbms-aad.database.windows.net/.default' }} \
                PG_POOL_MAX=${{ secrets.PG_POOL_MAX || '10' }} \
                AZURE_SEARCH_SERVICE=${{ secrets.AZURE_SEARCH_SERVICE }} \
                AZURE_SEARCH_API_KEY="${{ secrets.AZURE_SEARCH_API_KEY || '' }}" \
                AZURE_SEARCH_ENDPOINT_SUFFIX=${{ secrets.AZURE_SEARCH_ENDPOINT_SUFFIX || 'search.windows.net' }} \
                AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }} \
                AZURE_AD_CLIENT_ID=${{ secrets.AZURE_AD_CLIENT_ID }} \
                AZURE_AUTHORITY_HOST=${{ secrets.AZURE_AUTHORITY_HOST || 'https://login.microsoftonline.com' }} \
                PORT=3001 \
                NODE_ENV=production

            az webapp config set \
              --name ${{ vars.AZURE_API_APP_NAME }} \
              --resource-group ${{ vars.AZURE_API_RESOURCE_GROUP }} \
              --linux-fx-version "NODE|20"
