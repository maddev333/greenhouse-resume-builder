name: Deploy API to Azure Web App

# Auto-triggers are disabled: deployment is performed manually via a zip
# upload (npm run package:zip --workspace api). Run on demand from the Actions
# tab ("Run workflow") if you ever need the pipeline-based deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace shared

      - name: Build api package
        run: npm run build --workspace api

      - name: Assemble self-contained deployment package
        run: |
          set -euo pipefail
          # This repo is an npm workspaces monorepo, so api's runtime dependencies
          # (pg, helmet, cors, jose, jsonwebtoken, dotenv, @azure/*) and the
          # @greenhouse-resume-builder/shared package are hoisted to the ROOT
          # node_modules, NOT api/node_modules. Copying api/node_modules alone would
          # ship an incomplete dependency tree and crash at runtime. Instead, build an
          # isolated, production-only package outside the workspace tree so npm resolves
          # the complete dependency set.
          DEPLOY="${RUNNER_TEMP}/api-deploy"
          rm -rf "$DEPLOY"
          mkdir -p "$DEPLOY/vendor"

          # Pack the already-built shared workspace as a local tarball dependency.
          npm pack --workspace shared --pack-destination "$DEPLOY/vendor"
          shopt -s nullglob
          tarballs=("$DEPLOY"/vendor/*.tgz)
          SHARED_TGZ="$(basename "${tarballs[0]}")"

          # Application code + manifest.
          cp -R api/dist "$DEPLOY/dist"
          cp api/package.json "$DEPLOY/package.json"
          # web.config routes IIS/iisnode traffic to the Node app on Windows App
          # Service; without it IIS 404s every route (e.g. /ping).
          cp api/web.config "$DEPLOY/web.config"

          # Repoint the shared dependency at the local tarball, then install production
          # deps standalone (RUNNER_TEMP is outside the repo, so no workspace root applies).
          cd "$DEPLOY"
          SHARED_TGZ="$SHARED_TGZ" node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.dependencies['@greenhouse-resume-builder/shared']='file:vendor/'+process.env.SHARED_TGZ;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          npm install --omit=dev --no-audit --no-fund

          # Root server.js for Azure App Service compatibility (points to dist/server.js).
          echo "require('./dist/server.js');" > server.js

      - name: Set Azure Web App settings via Kudu API
        env:
          APP_NAME: ${{ vars.AZURE_API_APP_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          PGHOST: ${{ vars.PGHOST }}
          PGPORT: ${{ vars.PGPORT || '5432' }}
          PGDATABASE: ${{ vars.PGDATABASE || 'resume_builder' }}
          PGUSER: ${{ vars.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: ${{ vars.PGSSLMODE || 'require' }}
          PG_AAD_SCOPE: ${{ vars.PG_AAD_SCOPE || 'https://ossrdbms-aad.database.windows.net/.default' }}
          PG_POOL_MAX: ${{ vars.PG_POOL_MAX || '10' }}
          AZURE_SEARCH_SERVICE: ${{ vars.AZURE_SEARCH_SERVICE }}
          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
          AZURE_SEARCH_ENDPOINT_SUFFIX: ${{ vars.AZURE_SEARCH_ENDPOINT_SUFFIX || 'search.windows.net' }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_AD_CLIENT_ID: ${{ vars.AZURE_AD_CLIENT_ID }}
          AZURE_AUTHORITY_HOST: ${{ vars.AZURE_AUTHORITY_HOST || 'https://login.microsoftonline.com' }}
          NODE_ENV: "production"
          WEBSITE_NODE_DEFAULT_VERSION: "~20"
        run: |
          set -uo pipefail
          # Extract username, password, and the real SCM host from the publish profile.
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userName=")[^"]*' | head -n 1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=userPWD=")[^"]*' | head -n 1)
          # Newer App Service apps only expose a REGIONAL SCM host
          # (e.g. <app>.scm.<region>-01.azurewebsites.net); the legacy global
          # <app>.scm.azurewebsites.net no longer resolves. Read the real host from the
          # profile's MSDeploy publishUrl instead of constructing it from the app name.
          SCM_HOST=$(echo "$PUBLISH_PROFILE" | grep -oP '(?<=publishUrl=")[^"]*\.scm\.[^":/]*' | head -n 1)

          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Failed to extract credentials from publish profile"
            exit 1
          fi

          if [ -z "$SCM_HOST" ]; then
            SCM_HOST="${APP_NAME}.scm.azurewebsites.net"
            echo "Publish profile contained no SCM publishUrl; falling back to ${SCM_HOST}"
          fi
          SCM_URL="https://${SCM_HOST}"
          echo "Using SCM URL: ${SCM_URL}"

          # Best effort: app-settings sync must not block deploying the code itself,
          # but surface a clear warning (and the HTTP status) when it fails.
          HTTP_CODE=$(curl -sS -o /tmp/kudu_settings.out -w '%{http_code}' \
            -X POST "${SCM_URL}/api/settings" \
            -H "Content-Type: application/json" \
            -u "${USERNAME}:${PASSWORD}" \
            -d "{
              \"PGHOST\": \"${PGHOST}\",
              \"PGPORT\": \"${PGPORT}\",
              \"PGDATABASE\": \"${PGDATABASE}\",
              \"PGUSER\": \"${PGUSER}\",
              \"PGPASSWORD\": \"${PGPASSWORD}\",
              \"PGSSLMODE\": \"${PGSSLMODE}\",
              \"PG_AAD_SCOPE\": \"${PG_AAD_SCOPE}\",
              \"PG_POOL_MAX\": \"${PG_POOL_MAX}\",
              \"AZURE_SEARCH_SERVICE\": \"${AZURE_SEARCH_SERVICE}\",
              \"AZURE_SEARCH_API_KEY\": \"${AZURE_SEARCH_API_KEY}\",
              \"AZURE_SEARCH_ENDPOINT_SUFFIX\": \"${AZURE_SEARCH_ENDPOINT_SUFFIX}\",
              \"AZURE_TENANT_ID\": \"${AZURE_TENANT_ID}\",
              \"AZURE_AD_CLIENT_ID\": \"${AZURE_AD_CLIENT_ID}\",
              \"AZURE_AUTHORITY_HOST\": \"${AZURE_AUTHORITY_HOST}\",
              \"NODE_ENV\": \"${NODE_ENV}\",
              \"WEBSITE_NODE_DEFAULT_VERSION\": \"${WEBSITE_NODE_DEFAULT_VERSION}\"
            }") || true

          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "204" ]; then
            echo "App settings updated successfully (HTTP ${HTTP_CODE})."
          else
            echo "::warning::Failed to update app settings via Kudu API (HTTP ${HTTP_CODE:-000}); continuing with deployment."
            cat /tmp/kudu_settings.out 2>/dev/null || true
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/api-deploy
